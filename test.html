<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
</head>
<body>
    <h1>WebSocket Test Client</h1>
    
    <div>
        <button onclick="connect()">Connect WebSocket</button>
        <button onclick="checkHealth()">Check Server Health</button>
    </div>
    
    <div id="output"></div>
    
    <!-- Use CDN first to test -->
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script>
        let socket;
        const output = document.getElementById('output');
        
        function log(message) {
            const p = document.createElement('p');
            p.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            output.appendChild(p);
        }
        
        function connect() {
            log('Connecting to WebSocket...');
            
            // Try different connection methods
            socket = io('http://localhost:3000', {
                transports: ['websocket', 'polling'], // Try both
                reconnection: true,
                reconnectionAttempts: 3
            });
            
            socket.on('connect', () => {
                log('✅ Connected! Socket ID: ' + socket.id);
            });
            
            socket.on('welcome', (data) => {
                log('📨 Server says: ' + data.message);
            });
            
            socket.on('connect_error', (error) => {
                log('❌ Connection error: ' + error.message);
                console.error('Full error:', error);
            });
            
            socket.on('disconnect', (reason) => {
                log('📴 Disconnected: ' + reason);
            });
        }
        
        function checkHealth() {
            log('Checking server health...');
            fetch('http://localhost:3000/health')
                .then(res => res.json())
                .then(data => {
                    log('✅ Health check: ' + JSON.stringify(data));
                })
                .catch(err => {
                    log('❌ Health check failed: ' + err.message);
                });
        }
    </script>
</body>
</html>
