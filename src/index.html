<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Socket Room Tester</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body {
      font-family: monospace;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }
    input, button {
      padding: 8px;
      margin: 4px 0;
      width: 100%;
    }
    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: none;
    }
    pre {
      background: #020617;
      padding: 10px;
      height: 250px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h2>Socket.IO Room Tester</h2>

  <label>Session ID</label>
  <input id="sessionId" placeholder="paste sessionId here" />

  <label>User ID</label>
  <input id="userId" placeholder="paste userId here" />

  <button onclick="connectSocket()">Connect Socket</button>
  <button onclick="joinRoom()">Join Room</button>
  <button onclick="disconnectSocket()">Disconnect</button>

  <h3>Logs</h3>
  <pre id="logs"></pre>

  <script>
    let socket;

    function log(message) {
      const logs = document.getElementById("logs");
      logs.textContent += message + "\n";
      logs.scrollTop = logs.scrollHeight;
    }

    function connectSocket() {
      socket = io("http://localhost:3000");

      socket.on("connect", () => {
        log("✅ Connected: " + socket.id);
      });

      socket.on("peer-joined", (data) => {
        log("👤 Peer joined: " + JSON.stringify(data));
      });

      socket.on("peer-left", (data) => {
        log("❌ Peer left: " + JSON.stringify(data));
      });

      socket.on("disconnect", () => {
        log("⚠️ Disconnected from server");
      });

      socket.on("error", (err) => {
        log("❌ Error: " + err);
      });
    }

    function joinRoom() {
      const sessionId = document.getElementById("sessionId").value;
      const userId = document.getElementById("userId").value;

      if (!socket) {
        log("❌ Connect socket first");
        return;
      }

      socket.emit("join-room", { sessionId, userId });
      log("➡️ Sent join-room event");
    }

    function disconnectSocket() {
      if (socket) {
        socket.disconnect();
        socket = null;
      }
    }
  </script>

</body>
</html>
